name: Windows 桌面版

on:
  workflow_dispatch:
  push:
    branches:
      - feat/windows-desktop
    paths:
      - desktop/**
      - public/assets/icon-512.png
      - package.json
      - package-lock.json
      - tests/**
      - .github/workflows/windows-desktop.yml
  pull_request:
    paths:
      - desktop/**
      - public/assets/icon-512.png
      - package.json
      - package-lock.json
      - tests/**
      - .github/workflows/windows-desktop.yml

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 构建 Windows 安装包
        run: npm run desktop:dist

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: 吉政知行-Windows-v${{ github.run_number }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
