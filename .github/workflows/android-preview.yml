name: Android online preview
on:
  push:
    branches: ['feat/wenlv-product-v1', 'feat/wenlv-art-v094']
    paths:
      - 'mobile/site/**'
      - 'mobile/android/**'
      - '.github/workflows/android-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/site/**'
      - 'mobile/android/**'
      - '.github/workflows/android-preview.yml'
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$RUNNER_TEMP/android-sdk}}"
          mkdir -p "$SDK"
          if [ ! -x "$SDK/build-tools/35.0.0/aapt2" ] || [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
              MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            else
              curl --fail --silent --show-error --location --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$RUNNER_TEMP/android-cli.zip"
              echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/android-cli.zip" | sha256sum -c -
              mkdir -p "$SDK/cmdline-tools"
              unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
              mv "$RUNNER_TEMP/android-cli/cmdline-tools" "$SDK/cmdline-tools/latest"
              MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            fi
            set +o pipefail
            yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null
            set -o pipefail
            "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Build and verify hybrid APK
        run: bash mobile/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jizheng-v095-android
          path: dist/JiZhengZhiXing-v0.9.5-art-preview.apk
          if-no-files-found: error
          retention-days: 7
