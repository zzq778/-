name: Android multi-turn preview APK
on:
  push:
    branches: ['fix/mobile-chat-multitool']
    paths:
      - 'src/**'
      - 'mobile/site/**'
      - 'mobile/android/**'
      - 'wrangler.mobile-preview.jsonc'
      - 'scripts/check-mobile-service.mjs'
      - 'scripts/build-mobile-workspaces.mjs'
      - 'tests/**'
      - '.github/workflows/android-preview.yml'
permissions:
  contents: read
concurrency:
  group: jzzx-multitool-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preview deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
      - name: Run build and regression tests
        run: |
          npm run build:mobile
          npm test
      - name: Deploy isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '8181cde33c60feace3f3eee52ee2c207'
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.mobile-preview.jsonc --keep-vars
      - name: Verify isolated preview chat service
        env:
          MOBILE_SERVICE_BASE: 'https://jizhengzhixing-mobile-preview.zedi-li070614.workers.dev'
        run: node scripts/check-mobile-service.mjs
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$RUNNER_TEMP/android-sdk}}"
          mkdir -p "$SDK"
          if [ ! -x "$SDK/build-tools/35.0.0/aapt2" ] || [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
              MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            else
              curl --fail --silent --show-error --location --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$RUNNER_TEMP/android-cli.zip"
              echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/android-cli.zip" | sha256sum -c -
              mkdir -p "$SDK/cmdline-tools"
              unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
              mv "$RUNNER_TEMP/android-cli/cmdline-tools" "$SDK/cmdline-tools/latest"
              MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            fi
            set +o pipefail
            yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null
            set -o pipefail
            "$MANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Build and verify Android APK
        run: |
          bash mobile/android/build.sh
          sha256sum dist/JiZhengZhiXing-v1.0.6-no-code-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jizheng-v1.0.6-no-code-preview
          path: dist/JiZhengZhiXing-v1.0.6-no-code-preview.apk
          if-no-files-found: error
          retention-days: 14
