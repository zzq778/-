name: Wenlv Agent regression
on:
  push:
    branches: ['main', 'integrate/mobile-1.0.6-main-20261124']
    paths:
      - 'src/**'
      - 'mobile/**'
      - 'public/**'
      - 'tests/**'
      - 'website/**'
      - 'docs/DOMAIN_DEPLOYMENT.md'
      - '.github/workflows/wenlv-agent-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'mobile/**'
      - 'public/**'
      - 'tests/**'
      - 'website/**'
      - 'docs/DOMAIN_DEPLOYMENT.md'
      - '.github/workflows/wenlv-agent-tests.yml'
permissions:
  contents: read
concurrency:
  group: wenlv-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute project test suite
        run: |
          npm run build:mobile
          npm test

  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Mobile UI journey, web regression and official-site preservation
        run: |
          npm run build:mobile
          python tests/browser_mobile_product.py
          python tests/browser_workspaces.py
          python tests/browser_web_product.py
          python tests/browser_official_site.py
