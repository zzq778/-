(function(root){'use strict';
const AREA={'长春':'长春市','吉林市':'吉林市','雾凇岛':'吉林市','雾凇':'吉林市','松花湖':'吉林市','延吉':'延边州','延边':'延边州','珲春':'延边州','敦化':'延边州','集安':'通化市','通化':'通化市','查干湖':'松原市','松原':'松原市','白城':'白城市','四平':'四平市','辽源':'辽源市','白山市':'白山市'};
const THEMES=['雾凇','滑雪','冰雪','亲子','历史','博物馆','红色','民俗','美食','自然','森林','天池','冬捕','观鸟','湿地','摄影','边境','徒步','动物','温泉','电影'];
const NUM={一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};
const SLOTS=['上午','午后','傍晚'];
const uniq=a=>[...new Set(a)];
const names=a=>a.map(x=>x.name).join('、');
function parse(text,prefs,db,previous=null){
 const text0=String(text||'').trim().slice(0,180), terms=uniq([...db.A.map(a=>a.name),'滑雪','雪场','博物馆','徒步','登山','动物','温泉','冬捕','观鸟','湿地','古城','净月潭']).sort((a,b)=>b.length-a.length);
 let positive=text0;const excludes=[];for(const m of text0.matchAll(/(?:不想(?:去|玩|看|参加)?|不要(?:去|玩|看|参加)?|不去|避免(?:去|玩|参加)?|跳过|别(?:去|玩|参加)?)\s*/g)){
  const term=terms.find(x=>text0.slice(m.index+m[0].length).startsWith(x));if(term){excludes.push(term);positive=positive.replace(m[0]+term,' ')}
 }
 let areas=[];const matched=Object.entries(AREA).filter(([word])=>positive.includes(word));const direct=matched.filter(([word])=>!['雾凇','雾凇岛','松花湖','查干湖'].includes(word));if(direct.length)areas=uniq(direct.map(x=>x[1]));else if(matched.length)areas=uniq(matched.map(x=>x[1]));
 const mountain=/长白山|天池|北坡|西坡|南坡/.test(positive);if(mountain&&!areas.length)areas=['延边州','白山市'];
 if(!areas.length&&prefs.city&&prefs.city!=='全省')areas=[prefs.city];
 const m=positive.match(/([0-9]+|[一二两三四五六七八九十])\s*(?:天|日)/);const requested=m?(NUM[m[1]]||Number(m[1])):/周末/.test(positive)?2:/当天|一日游/.test(positive)?1:prefs.days||previous?.days||0;
 const days=requested?Math.min(3,Math.max(1,requested)):0;
 const season=(positive.match(/[春夏秋冬](?:天|季)/)||[])[0]?.[0]||(prefs.season!=='不限'?prefs.season:null)||previous?.season||null;
 let themes=THEMES.filter(t=>(positive+(prefs.who||'')).includes(t));if(/带娃|孩子|小孩/.test(positive))themes.push('亲子');
 const who=/父母|爸妈|长辈|老人|爷爷|奶奶/.test(positive)?'长辈':/带娃|亲子|孩子|小孩/.test(positive)?'亲子':prefs.who!=='不限'?prefs.who:previous?.who||'不限';
 const exact=db.A.filter(a=>positive.includes(a.name)).map(a=>a.id);
 if(!areas.length&&previous?.areas)areas=previous.areas.slice();
 if(!themes.length&&previous?.themes)themes=previous.themes.slice();
 const exclusion=uniq([...(previous?.excludes||[]),...excludes]);
 return {areas,days,requested,season,themes:uniq(themes),who,excludes:exclusion,exact:uniq(exact.length?exact:(!direct.length?(previous?.exact||[]):[])),mountain:mountain||(!direct.length&&!(prefs.city&&prefs.city!=='全省')&&!!previous?.mountain),relaxed:/轻松|慢慢|少走|不赶|休闲/.test(positive)||!!previous?.relaxed};
}
function excluded(a,c){return c.excludes.some(term=>(a.name+' '+a.tags).includes(term))}
function search(c,db){
 let candidates=db.A.filter(a=>(!c.areas.length||c.areas.includes(a.city))&&!excluded(a,c));
 if(c.mountain&&!c.areas.some(a=>!['延边州','白山市'].includes(a)))candidates=candidates.filter(a=>a.cluster==='长白山');
 const score=a=>c.themes.reduce((n,t)=>n+((a.name+' '+a.tags).includes(t)?5:0),0)+(c.season?(a.season==='all'||a.season.includes(c.season)?3:-2):0)+(c.exact.includes(a.id)?20:0)+(c.who==='亲子'&&/亲子|动物|科普/.test(a.tags)?4:0)+(c.who==='长辈'&&/登山|滑雪|徒步/.test(a.tags)?-6:0);
 candidates=candidates.slice().sort((a,b)=>score(b)-score(a)||a.id.localeCompare(b.id));

 return {candidates,score};
}
function draft(c,retrieval,db){
 const limit=c.relaxed||c.who==='长辈'?2:3;const ids=new Set(retrieval.candidates.map(a=>a.id));
 const templates=db.R.filter(r=>r.days===c.days&&r.plan.every(d=>d.length<=limit&&d.every(id=>ids.has(id))));
 const chosen=templates.map(r=>({r,score:r.plan.flat().reduce((n,id)=>n+retrieval.score(db.byId[id]),0)})).sort((a,b)=>b.score-a.score)[0]?.r;
 const selected=chosen?chosen.plan.map(d=>d.slice()):Array.from({length:c.days},(_,i)=>retrieval.candidates.slice(i*limit,(i+1)*limit).map(a=>a.id));
 return {nodes:selected,title:c.days+' 天 · '+uniq(selected.flat().map(id=>db.byId[id].city)).join(' / '),route:chosen?.id||null};

function review(c,retrieval,plan,db){
 const ids=plan.nodes.flat(),seen=new Set(),allow=new Set(retrieval.candidates.map(a=>a.id));const problems=[];
 if(plan.nodes.length!==c.days||plan.nodes.some(d=>d.length>3))problems.push('结构错误');
 for(const id of ids){const a=db.byId[id];if(!a||!allow.has(id)||seen.has(id))problems.push('景点无效或重复');else{if(excluded(a,c)||c.areas.length&&!c.areas.includes(a.city))problems.push('不符合地区或排除条件');if(!/^https?:\/\//.test(a.url||''))problems.push('缺资料入口')}seen.add(id)}

 return {ok:!problems.length,problems,places:ids.length};

function agent({text,prefs,db,previous=null}){

 const criteria=parse(text,prefs,db,previous);add('理解需求',[criteria.areas.join(' / '),criteria.days&&criteria.days+' 天',criteria.who!=='不限'&&criteria.who,criteria.season&&criteria.season+'季',criteria.excludes.length&&'排除 '+criteria.excludes.join('、')].filter(Boolean).join(' · ')||'尚无明确目的地或主题');
 if(!criteria.areas.length&&!criteria.themes.length&&!criteria.exact.length){add('补充条件','缺少目的地或兴趣主题');return {status:'clarify',question:'您想去哪个城市，或者更喜欢冰雪、民俗还是自然风光？',criteria,trace}}

 if(!audit.ok)return {status:'no-match',question:'暂时没有合适的安排，试试调整出游条件。',criteria,trace};
 const warnings=[];if(criteria.requested>3)warnings.push('当前最多规划 3 天，较长行程请分段处理。');if(plan.nodes.some(d=>!d.length))warnings.push('部分时段安排较少，可留作自由活动。');if(criteria.season){const poor=plan.nodes.flat().map(id=>db.byId[id]).filter(a=>a.season!=='all'&&!a.season.includes(criteria.season));if(poor.length)warnings.push(names(poor)+' 并非所选季节首选，请向景区核实。')}

}
root.OfflineTravelAgent={agent,parse,search,draft,review};
})(globalThis);

const toolLabels={search_places:'检索候选景点',inspect_place:'查阅景点资料',draft_itinerary:'编排行程',review_itinerary:'复核行程',ask_user:'确认旅行偏好',finish:'交付行程'};
function composeCloud(text,criteria){
 const raw=String(text||'').trim().slice(0,140),parts=[];
 const c=criteria;
 if(c.mountain)parts.push('长白山');
 else if(c.areas.length)parts.push(c.areas.join('、'));
 if(c.requested)parts.push(c.requested+'天');
 if(c.who!=='不限')parts.push(c.who);
 if(c.season)parts.push(c.season+'季');
 if(c.themes.length)parts.push(c.themes.join('、'));
 if(c.relaxed)parts.push('轻松慢游');
 for(const id of c.exact||[]){if(byId[id])parts.push(byId[id].name);}
 for(const x of c.excludes)parts.push('不去'+x);
 // Put the current effective conditions first. Keep free-text nuance when space permits.

}

 if(!p||!Number.isInteger(p.days)||p.days<1||p.days>3||!Array.isArray(p.plan)||p.plan.length!==p.days)throw Error('暂时无法显示行程');

 for(const [i,d] of p.plan.entries()){
  if(d.day!==i+1||!Array.isArray(d.nodes)||d.nodes.length>3)throw Error('暂时无法显示行程');
  const nn=[],ss=[];
  for(const n of d.nodes){const id=n.attractionId;if(!Object.hasOwn(byId,id)||seen.has(id)||!['上午','午后','傍晚'].includes(n.slot))throw Error('暂时无法显示行程');seen.add(id);nn.push(id);ss.push(n.slot);}
  nodes.push(nn);slots.push(ss);

 if(!seen.size)throw Error('没有找到合适的景点');

 return {title:[...new Set(nodes.flat().map(id=>byId[id].city))].join(' / ')+['','一日游','两日游','三日游'][p.days],nodes,slots,source:genuine?'联网规划':'资料规划',reason:'景点与游览顺序依据出游条件及景点资料安排。',answer:typeof res.text==='string'?res.text.slice(0,1400):'',warnings:[...new Set((Array.isArray(p.warnings)?p.warnings:[]).map(travelWarning).filter(Boolean))].slice(0,10),trace:cleanTrace(res.trace)};

function me(){return `<div class="page"><div class="page-title"><h1>我的</h1><p>旅行计划与使用设置</p></div><section class="info-card"><h2>已保存的行程</h2>${savedTrips.length?`<ul class="trip-list">${savedTrips.map((t,i)=>`<li><button class="saved-trip" data-restore-trip="${i}"><b>${esc(t.title)}</b><small>${t.nodes.length} 天 / ${t.nodes.flat().length} 处景点</small></button><button class="text-button danger" data-forget-trip="${i}" aria-label="删除${esc(t.title)}">删除</button></li>`).join('')}</ul>`:'<div class="empty compact"><p>还没有保存行程。</p><button class="secondary" data-tab="home">去规划</button></div>'}</section><section class="info-card settings"><h2>运营端</h2>${portalShortcuts()}<p class="fine">当前为本机工作台，切换入口不代表拥有真实政府或商户身份。</p></section><section class="info-card settings"><h2>使用设置</h2><button class="setting-row" data-act="settings"><span>规划方式</span><span>${mode==='cloud'?'联网':'离线'} ›</span></button><button class="setting-row" data-act="large"><span>大字模式</span><span>切换 ›</span></button></section><section class="info-card about"><h2>关于吉政知行</h2><p>吉林旅行指南 · 0.9.7</p><p>提供景点资料、参考行程与智能规划。联网时由模型协助安排，离线时依据本地资料；不提供实时导航、预订或票务服务。</p><p>本应用并非政府官方服务。旅行记录与已保存行程存于本机；联网规划会将旅行需求发送至服务端，访问码不保存。</p></section></div>`}

function render(){const badge=$('#modeBadge');if(badge){badge.textContent=mode==='cloud'?'联网规划':'离线规划';badge.dataset.modeState=mode;}$('#screen').innerHTML=({home,explore,portal:portals,workspaces,me,trip})[tab]();if(tab==='workspaces')mountWorkspace();document.querySelectorAll('.bottom button').forEach(b=>{const active=b.dataset.tab===(tab==='trip'?tripFrom:tab==='workspaces'?workspaceFrom:tab);b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}function saveFeedback(){try{localStorage.setItem('wenlv-preview-feedback',JSON.stringify(feedback))}catch{alert('此设备无法保存记录，离开应用后可能丢失。')}}function msg(t){status=t;if($('#notice'))$('#notice').textContent=t;else alert(t)}
document.addEventListener('input',e=>{if(e.target.id==='q')q=e.target.value;if(e.target.id==='accessCode')accessCode=e.target.value});document.addEventListener('toggle',e=>{if(e.target.classList?.contains('preferences'))prefsExpanded=e.target.open;if(e.target.classList?.contains('cloud-panel'))cloudSettingsOpen=e.target.open;},true);document.addEventListener('change',e=>{if(e.target.id==='city'){prefs.city=e.target.value;const p=$('#preferenceSummary');if(p)p.textContent=preferenceSummary();}});document.addEventListener('submit',e=>{if(e.target.id==='planner'){e.preventDefault();build()}if(e.target.id==='revision'){e.preventDefault();const rev=$('#rev').value.trim();if(rev)runAgent(rev,taskContext)}if(e.target.id==='feedback'){e.preventDefault();const t=$('#fb').value.trim();if(t&&feedback.length<50){feedback.unshift({text:t.slice(0,200),reply:''});saveFeedback();render()}}});document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(running){if(b.dataset.act==='cancel'&&activeRequest){requestCancelled=true;activeRequest.abort()}return;}if(b.dataset.mode){if(b.dataset.mode==='cloud'&&location.origin!==CLOUD_ORIGIN)return;mode=b.dataset.mode==='cloud'?'cloud':'local';cloudError='';cloudSettingsOpen=mode==='cloud'&&!accessCode;if(mode==='local')accessCode='';render();return}if(b.dataset.example){q=b.dataset.example;taskContext=null;taskTrace=[];clarification='';adjusting=false;plan=null;$('#q').value=q;status='';cloudError='';update();$('#q').focus();return}if(b.dataset.routeFilter&&Object.hasOwn(ROUTE_FILTERS,b.dataset.routeFilter)){routeFilter=b.dataset.routeFilter;render();return}if(b.dataset.workspace&&Object.hasOwn(workspaceRoles,b.dataset.workspace)){selectWorkspace(b.dataset.workspace);if(tab!=='workspaces'){workspaceFrom=tab;go('workspaces')}else render();return}if(b.dataset.tab){if(b.dataset.tab==='workspaces'){selectWorkspace(preferredPortal);workspaceFrom=tab}go(b.dataset.tab);return}if(b.dataset.pref){const k=b.dataset.pref;prefs[k]=k==='days'?Number(b.dataset.val):b.dataset.val;b.parentNode.querySelectorAll('button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});const p=$('#preferenceSummary');if(p)p.textContent=preferenceSummary();return}if(b.dataset.route){route(b.dataset.route);return}if(b.dataset.reply!==undefined){const i=Number(b.dataset.reply),v=$('#reply'+i).value.trim();if(feedback[i]){feedback[i].reply=v.slice(0,200);saveFeedback();render()}return}if(b.dataset.restoreTrip!==undefined){const t=savedTrips[Number(b.dataset.restoreTrip)];if(t){plan=t;taskContext=null;taskTrace=[];clarification='';status='';cloudError='';tripFrom='me';tab='trip';render();window.scrollTo(0,0);}return}if(b.dataset.forgetTrip!==undefined){const i=Number(b.dataset.forgetTrip);if(savedTrips[i]&&confirm('删除这份已保存的行程？')){if(persistTrips(savedTrips.filter((_,j)=>i!==j)))render();else alert('无法删除行程，请检查设备存储。')}return}if(b.dataset.deleteNote!==undefined){const i=Number(b.dataset.deleteNote);if(feedback[i]&&confirm('删除这条旅途记录？')){feedback.splice(i,1);saveFeedback();render()}return}switch(b.dataset.act){case 'current':tripFrom='home';tab='trip';render();window.scrollTo(0,0);break;case 'back-trip':go(tripFrom);break;case 'settings':cloudSettingsOpen=true;go('home');{const d=$('.cloud-panel');if(d){d.open=true;d.scrollIntoView({block:'center'});$('#accessCode')?.focus();}}break;case 'customize-route':{adjusting=false;const r=R.find(x=>x.id===plan?.routeId);if(!r)break;taskContext=null;taskTrace=[];clarification='';cloudError='';plan=null;status='';prefs={city:'全省',days:r.days,who:'不限',season:'不限'};q='参考'+r.name+'（'+r.plan.flat().map(id=>byId[id]?.name).filter(Boolean).join('、')+'），按我的偏好定制行程。';tab='home';render();$('#q')?.focus();$('#q')?.scrollIntoView({block:'center'});break}case 'save':if(plan){const t=cleanSaved(plan);if(!t){msg('这份行程无法保存，请重新规划。');break}const rest=savedTrips.filter(x=>tripSignature(x)!==tripSignature(t));if(rest.length>=20){msg('已保存 20 份行程，请先删除不需要的行程。');break}if(persistTrips([t,...rest])){msg('已保存到我的行程。');b.textContent='已保存';}else msg('此设备无法保存行程。');}break;case 'restore':if(saved){tripFrom=tab==='me'?'me':'home';plan=saved;taskContext=null;clarification='';status='';cloudError='';tab='trip';render();window.scrollTo(0,0)}break;case 'answer':$('#q')?.focus();$('#q')?.scrollIntoView({block:'center'});break;case 'reset':cloudError='';adjusting=false;taskContext=null;taskTrace=[];clarification='';status='';plan=null;q='';prefs={city:'全省',days:0,who:'不限',season:'不限'};prefsExpanded=false;tab='home';render();$('#q')?.focus();break;case 'adjust':adjusting=!!taskContext;status='';q='';tab='home';render();$('#q').value='';$('#q')?.focus();$('#q')?.scrollIntoView({block:'center'});break;case 'large':{const big=document.body.classList.toggle('big');try{localStorage.setItem('jzzx-large-text',big?'1':'0')}catch{}break;}case 'voice':{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('当前浏览器不支持语音输入，请键盘输入。');break}try{const r=new SR();r.lang='zh-CN';r.onresult=e=>{$('#q').value=e.results[0][0].transcript;q=$('#q').value};r.onerror=()=>alert('语音输入不可用，请键盘输入。');r.start()}catch{alert('无法启动语音输入。')}break}case 'speak':if(!plan)break;if(!window.speechSynthesis){msg('当前浏览器不支持朗读');break}if(speechSynthesis.speaking){speechSynthesis.cancel();msg('已停止朗读');break}const u=new SpeechSynthesisUtterance(plan.nodes.map((d,i)=>'第'+(i+1)+'天，'+d.map(id=>byId[id].name).join('，')).join('。'));u.lang='zh-CN';speechSynthesis.speak(u);msg('正在朗读，再次点击停止');break;case 'share':if(!plan)break;const text=plan.title+'\n'+plan.nodes.map((d,i)=>'第'+(i+1)+'天：'+d.map(id=>byId[id].name).join('、')).join('\n')+'\n开放、预约与交通请提前核实。';try{if(navigator.share){await navigator.share({title:'吉林旅行',text});break}if(navigator.clipboard){await navigator.clipboard.writeText(text);msg('已复制行程');break}}catch(err){if(err.name==='AbortError')break}prompt('长按复制行程',text);break}});render();
</script></body></html>
