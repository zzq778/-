</style></head><body><div class="app"><header class="top"><div class="brand"><span class="mark">吉</span><div><strong>吉政知行</strong><small>吉林文旅 · 智能旅行助手</small></div></div><span class="mode">本地 Agent</span></header><main id="screen"></main><nav class="bottom" aria-label="导航"><button data-tab="home" class="active"><i>⌂</i>首页</button><button data-tab="explore"><i>◈</i>发现</button><button data-tab="portal"><i>◎</i>协作</button><button data-tab="me"><i>♙</i>我的</button></nav></div><script>/* Deterministic offline tool agent. No LLM, network or hidden model calls. */
(function(root){'use strict';
const AREA={'长春':'长春市','吉林市':'吉林市','雾凇岛':'吉林市','雾凇':'吉林市','松花湖':'吉林市','延吉':'延边州','延边':'延边州','珲春':'延边州','敦化':'延边州','集安':'通化市','通化':'通化市','查干湖':'松原市','松原':'松原市','白城':'白城市','四平':'四平市','辽源':'辽源市','白山市':'白山市'};
const THEMES=['雾凇','滑雪','冰雪','亲子','历史','博物馆','红色','民俗','美食','自然','森林','天池','冬捕','观鸟','湿地','摄影','边境','徒步','动物','温泉','电影'];
const NUM={一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};
const SLOTS=['上午','午后','傍晚'];
const uniq=a=>[...new Set(a)];
const names=a=>a.map(x=>x.name).join('、');
function parse(text,prefs,db,previous=null){
 const text0=String(text||'').trim().slice(0,180), terms=uniq([...db.A.map(a=>a.name),'滑雪','雪场','博物馆','徒步','登山','动物','温泉','冬捕','观鸟','湿地','古城','净月潭']).sort((a,b)=>b.length-a.length);
 let positive=text0;const excludes=[];for(const m of text0.matchAll(/(?:不想(?:去|玩|看|参加)?|不要(?:去|玩|看|参加)?|不去|避免(?:去|玩|参加)?|跳过|别(?:去|玩|参加)?)\s*/g)){
  const term=terms.find(x=>text0.slice(m.index+m[0].length).startsWith(x));if(term){excludes.push(term);positive=positive.replace(m[0]+term,' ')}
 }
 let areas=[];const matched=Object.entries(AREA).filter(([word])=>positive.includes(word));const direct=matched.filter(([word])=>!['雾凇','雾凇岛','松花湖','查干湖'].includes(word));if(direct.length)areas=uniq(direct.map(x=>x[1]));else if(matched.length)areas=uniq(matched.map(x=>x[1]));
 const mountain=/长白山|天池|北坡|西坡|南坡/.test(positive);if(mountain&&!areas.length)areas=['延边州','白山市'];
 if(!areas.length&&prefs.city&&prefs.city!=='全省')areas=[prefs.city];
 const m=positive.match(/([0-9]+|[一二两三四五六七八九十])\s*(?:天|日)/);const requested=m?(NUM[m[1]]||Number(m[1])):/周末/.test(positive)?2:/当天|一日游/.test(positive)?1:prefs.days||previous?.days||0;
 const days=requested?Math.min(3,Math.max(1,requested)):0;
 const season=(positive.match(/[春夏秋冬](?:天|季)/)||[])[0]?.[0]||(prefs.season!=='不限'?prefs.season:null)||previous?.season||null;
 let themes=THEMES.filter(t=>(positive+(prefs.who||'')).includes(t));if(/带娃|孩子|小孩/.test(positive))themes.push('亲子');
 const who=/父母|爸妈|长辈|老人|爷爷|奶奶/.test(positive)?'长辈':/带娃|亲子|孩子|小孩/.test(positive)?'亲子':prefs.who!=='不限'?prefs.who:previous?.who||'不限';
 const exact=db.A.filter(a=>positive.includes(a.name)).map(a=>a.id);
 if(!areas.length&&previous?.areas)areas=previous.areas.slice();
 if(!themes.length&&previous?.themes)themes=previous.themes.slice();
 const exclusion=uniq([...(previous?.excludes||[]),...excludes]);
 return {areas,days,requested,season,themes:uniq(themes),who,excludes:exclusion,exact:uniq(exact),mountain:mountain||!!previous?.mountain,relaxed:/轻松|慢慢|少走|不赶|休闲/.test(positive)||!!previous?.relaxed};
}
function excluded(a,c){return c.excludes.some(term=>(a.name+' '+a.tags).includes(term))}
function search(c,db){
 let candidates=db.A.filter(a=>(!c.areas.length||c.areas.includes(a.city))&&!excluded(a,c));
 if(c.mountain&&!c.areas.some(a=>!['延边州','白山市'].includes(a)))candidates=candidates.filter(a=>a.cluster==='长白山');
 const score=a=>c.themes.reduce((n,t)=>n+((a.name+' '+a.tags).includes(t)?5:0),0)+(c.season?(a.season==='all'||a.season.includes(c.season)?3:-2):0)+(c.exact.includes(a.id)?20:0)+(c.who==='亲子'&&/亲子|动物|科普/.test(a.tags)?4:0)+(c.who==='长辈'&&/登山|滑雪|徒步/.test(a.tags)?-6:0);
 candidates=candidates.slice().sort((a,b)=>score(b)-score(a)||a.id.localeCompare(b.id));
 if(!c.areas.length&&candidates.length){const city=candidates[0].city;candidates=candidates.filter(a=>a.city===city)}
 return {candidates,score};
}
function draft(c,retrieval,db){
 const limit=c.relaxed||c.who==='长辈'?2:3;const ids=new Set(retrieval.candidates.map(a=>a.id));
 const templates=db.R.filter(r=>r.days===c.days&&r.plan.every(d=>d.length<=limit&&d.every(id=>ids.has(id))));
 const chosen=templates.map(r=>({r,score:r.plan.flat().reduce((n,id)=>n+retrieval.score(db.byId[id]),0)})).sort((a,b)=>b.score-a.score)[0]?.r;
 const selected=chosen?chosen.plan.map(d=>d.slice()):Array.from({length:c.days},(_,i)=>retrieval.candidates.slice(i*limit,(i+1)*limit).map(a=>a.id));
 return {nodes:selected,title:c.days+' 天 · '+uniq(selected.flat().map(id=>db.byId[id].city)).join(' / '),route:chosen?.id||null};
}
function review(c,retrieval,plan,db){
 const ids=plan.nodes.flat(),seen=new Set(),allow=new Set(retrieval.candidates.map(a=>a.id));const problems=[];
 if(plan.nodes.length!==c.days||plan.nodes.some(d=>d.length>3))problems.push('结构错误');
 for(const id of ids){const a=db.byId[id];if(!a||!allow.has(id)||seen.has(id))problems.push('景点无效或重复');else{if(excluded(a,c)||c.areas.length&&!c.areas.includes(a.city))problems.push('不符合地区或排除条件');if(!/^https?:\/\//.test(a.url||''))problems.push('缺资料入口')}seen.add(id)}
 if(!ids.length)problems.push('无匹配景点');
 return {ok:!problems.length,problems,places:ids.length};
}
function agent({text,prefs,db,previous=null}){
 const trace=[];const add=(tool,detail)=>trace.push({tool,detail,actor:'local'});
 const criteria=parse(text,prefs,db,previous);add('理解需求',[criteria.areas.join(' / '),criteria.days&&criteria.days+' 天',criteria.who!=='不限'&&criteria.who,criteria.season&&criteria.season+'季',criteria.excludes.length&&'排除 '+criteria.excludes.join('、')].filter(Boolean).join(' · ')||'尚无明确目的地或主题');
 if(!criteria.areas.length&&!criteria.themes.length&&!criteria.exact.length){add('补充条件','缺少目的地或兴趣主题');return {status:'clarify',question:'您想去哪个城市，或者更喜欢冰雪、民俗还是自然风光？',criteria,trace}}
 if(!criteria.days){add('补充条件','缺少旅行天数');return {status:'clarify',question:'这次计划玩几天？请选择 1–3 天或直接输入。',criteria,trace}}
 const retrieval=search(criteria,db);add('检索知识库',`符合条件的景点 ${retrieval.candidates.length} 个`);
 if(!retrieval.candidates.length)return {status:'no-match',question:'没有同时满足这些条件的景点，请放宽目的地或排除条件。',criteria,trace};
 const plan=draft(criteria,retrieval,db);add('编排行程',(plan.route?'使用符合条件的精选线路':'按匹配度与旅行节奏编排')+' · '+plan.nodes.flat().length+' 个节点');
 const audit=review(criteria,retrieval,plan,db);add('复核行程',audit.ok?'地区、排除项、节点去重及资料入口通过':audit.problems.join('；'));

/small></button></div><p class="fine">40 处景点 · 12 条线路<br>非政府官方应用 · 不提供实时开放、交通或预约结果</p></div>`}
function traceView(trace){return trace?.length?`<details class="agent-trace" open><summary>吉小知 · 实际执行记录</summary><ol>${trace.map((t,i)=>`<li><i>${i+1}</i><div><b>${esc(t.tool)}</b><small>${esc(t.detail)} · ${t.actor==='model'?'模型选择':t.actor==='system'?'系统执行':'本机规则'}</small></div></li>`).join('')}</ol><p class="agent-subtitle">记录来自实际工具执行。模型选择与系统执行均分别标注，不是隐藏思考。</p></details>`:''}
function result(){const core=resultCore();return (cloudError?'<div class="cloud-error" role="alert">'+esc(cloudError)+' · 可重试，或手动切换离线规划。</div>':'')+core;}
function resultCore(){const ask=clarification?`<section class="agent-chat" id="clarification"><span class="agent-pill">需要补充需求</span><h3>${esc(clarification)}</h3>${traceView(taskTrace)}<button class="secondary" data-act="answer">补充条件</button><button class="agent-clear" data-act="reset">重新开始</button></section>`:'';
if(clarification)return ask+(saved?`<div class="saved"><div><span class="kicker">已保存旅行</span><b>${esc(saved.title)}</b></div><button class="secondary" data-act="restore">查看</button></div>`:'');
if(!plan&&status)return `<div class="agent-chat" role="status"><h3>${esc(status)}</h3>${traceView(taskTrace)}<button class="secondary" data-act="reset">重新开始</button>${saved?' <button class="secondary" data-act="restore">查看已保存行程</button>':''}</div>`;if(!plan)return saved?`<div class="saved"><div><span class="kicker">我的旅行计划</span><b>${esc(saved.title)}</b></div><button class="secondary" data-act="restore">继续查看 →</button></div>`:status?`<div class="info-card" role="status">${esc(status)}${traceView(taskTrace)}<button class="secondary" data-act="reset">重新开始</button></div>`:'';return `<section class="result" id="result"><div class="result-head"><div><span class="kicker">${esc(plan.source)}</span><h2>${esc(plan.title)}</h2></div><button class="secondary" data-act="save">☆ 保存</button></div>${plan.answer?`<p class="cloud-answer">${esc(plan.answer)}</p>`:''}${traceView(plan.trace)}<details><summary>为什么这样安排？</summary><p>${esc(plan.reason)}</p></details>${plan.warnings?.length?`<div class="agent-warnings">${plan.warnings.map(w=>`<p>· ${esc(w)}</p>`).join('')}</div>`:''}<div class="risk">建议游览顺序，不是导航路线。开放、预约及实际转场请提前核实。</div>${plan.nodes.map((day,i)=>`<section class="day"><h3><span>DAY ${String(i+1).padStart(2,'0')}</span>第 ${i+1} 天</h3>${day.length?day.map((id,j)=>{const a=byId[id];if(!a)return '';return `<article class="node"><span class="dot"></span><div><small>${esc(plan.slots?.[i]?.[j]||['上午','午后','傍晚'][j])} · ${esc(a.city)}</small><h4>${esc(a.name)}</h4><p>${esc(a.tags.replaceAll(' ',' · '))}</p><details><summary>行前确认与资料来源</summary><p>请以景区或当地文旅部门公告为准，不保证当前开放。</p><p>仓库记录核对日期：${a.verified}</p><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">查看资料入口 ↗</a></details></div></article>`}).join(''):'<p class="fine">当天留作机动，没有足够匹配的景点。</p>'}</section>`).join('')}<details><summary>出发前请确认</summary><p>交通距离、天气、门票及预约需要另行核对；冬季路面可能结冰。</p></details><div class="actions"><button class="secondary" data-act="speak">朗读</button><button class="secondary" data-act="share">分享</button><button class="secondary" data-act="adjust">调整</button></div><p class="notice" id="notice" role="status">${esc(status)}</p>${taskContext?`<div class="agent-revision"><h3>让吉小知继续调整</h3><p>例如：改成一天、轻松一些、不去净月潭。保留本次未更改的条件。</p><form id="revision"><textarea id="rev" maxlength="140" aria-label="调整旅行计划" placeholder="告诉我需要改变什么"></textarea><button type="submit" class="primary">调整这份行程 →</button></form></div>`:''}</section>`}
function showWorking(on){const e=$('#agentLive');if(e){e.hidden=!on;e.innerHTML=on?'<div class="agent-working"><span class="agent-spin" aria-hidden="true"></span>正在检索、编排并复核行程…</div>':'';}}
const toolLabels={search_places:'检索候选景点',inspect_place:'查阅景点资料',draft_itinerary:'编排行程',review_itinerary:'复核行程',ask_user:'确认旅行偏好',finish:'交付行程'};
function composeCloud(text,criteria){
 const raw=String(text||'').trim().slice(0,140),parts=[];
 const c=criteria;
 if(c.mountain)parts.push('长白山');
 else if(c.areas.length)parts.push(c.areas.join('、'));
 if(c.requested)parts.push(c.requested+'天');
 if(c.who!=='不限')parts.push(c.who);
 if(c.season)parts.push(c.season+'季');
 if(c.themes.length)parts.push(c.themes.join('、'));
 if(c.relaxed)parts.push('轻松慢游');
 for(const id of c.exact||[]){if(byId[id])parts.push(byId[id].name);}
 for(const x of c.excludes)parts.push('不去'+x);
 // Put the current effective conditions first. Keep free-text nuance when space permits.
 const base=parts.join('，');return [base,raw].filter(Boolean).join('，').slice(0,300);
}
function cloudPlan(res){
 const p=res.itinerary;
 if(!p||!Number.isInteger(p.days)||p.days<1||p.days>3||!Array.isArray(p.plan)||p.plan.length!==p.days)throw Error('云端行程格式不匹配');
 const seen=new Set(),nodes=[],slots=[];
 for(const [i,d] of p.plan.entries()){
  if(d.day!==i+1||!Array.isArray(d.nodes)||d.nodes.length>3)throw Error('云端日期格式不匹配');
  const nn=[],ss=[];
  for(const n of d.nodes){const id=n.attractionId;if(!Object.hasOwn(byId,id)||seen.has(id)||!['上午','午后','傍晚'].includes(n.slot))throw Error('云端景点数据需更新');seen.add(id);nn.push(id);ss.push(n.slot);}
  nodes.push(nn);slots.push(ss);
 }
 if(!seen.size)throw Error('云端行程为空');
 const genuine=res.degraded===false&&Number.isInteger(res.modelActions)&&res.modelActions>=4;
 return {title:p.days+' 天 · '+[...new Set(nodes.flat().map(id=>byId[id].city))].join(' / '),nodes,slots,source:genuine?'云端 AI · 已完成多轮工具调用':'云端知识库 · 模型流程未完整完成',reason:genuine?'模型选择工具并在服务端规则复核后交付。':'云端系统已生成可核对的行程；没有把降级结果冒充为模型完成。',answer:typeof res.text==='string'?res.text.slice(0,1400):'',warnings:(Array.isArray(p.warnings)?p.warnings:[]).map(x=>typeof x?.message==='string'?x.message.slice(0,240):'').filter(Boolean).slice(0,10),trace:cleanTrace(res.trace)};
}
function cleanTrace(trace){return Array.isArray(trace)?trace.filter(t=>Object.hasOwn(toolLabels,t?.tool)&&typeof t.detail==='string').slice(0,12).map(t=>({tool:toolLabels[t.tool],detail:t.detail.slice(0,250),actor:t.actor==='model'?'model':'system'})):[];}
async function runCloud(text,previous){
 if(running)return;
 if(location.origin!==CLOUD_ORIGIN){cloudError='云服务域名不匹配';update();return;}
 if(accessCode.length<16){cloudError='请输入至少 16 位团队访问码';update();return;}
 running=true;cloudError='';status='';showWorking(true);const old=plan;
 const button=$('#planner button[type=submit]');if(button)button.disabled=true;
 const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),45000);
 try{
  const criteria=OfflineTravelAgent.parse(text,prefs,{A,R,byId},previous);
  const question=composeCloud(text,criteria);if(!question)throw Error('请先描述旅行想法');
  const response=await fetch(CLOUD_ORIGIN+'/api/travel',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+accessCode},credentials:'omit',cache:'no-store',redirect:'error',signal:ctl.signal,body:JSON.stringify({question})});
  const res=await response.json().catch(()=>null);
  if(!response.ok)throw Error(response.status===401?'访问码不正确':response.status===429?'请求过多，请稍后再试':response.status===503?'云端服务尚未就绪':response.status===404?'云端接口尚未部署':'云端请求失败');
  if(res?.mode!=='wenlv-agent')throw Error('云端返回的协议不匹配');
  taskContext=criteria;taskTrace=cleanTrace(res.trace);clarification='';
  if(res.status==='clarify'){clarification=String(res.text||'请补充旅行条件').slice(0,240);plan=null;q='';if($('#q'))$('#q').value='';update();return;}
  if(res.status==='no-match'){plan=null;status=String(res.text||'没有匹配的景点').slice(0,240);update();return;}
  if(res.status!=='complete')throw Error('云端未返回有效行程');
  plan=cloudPlan(res);update(true);
 }catch(e){plan=old;cloudError=e?.name==='AbortError'?'云端响应超时':e instanceof TypeError?'未能连接云服务':String(e?.message||'云端服务不可用').slice(0,120);update();}
 finally{clearTimeout(timer);running=false;showWorking(false);const b=$('#planner button[type=submit]');if(b)b.disabled=false;}
}
function runAgent(text,previous=null){
 if(mode==='cloud'){void runCloud(text,previous);return;}
 cloudError='';
if(running)return;running=true;showWorking(true);const last=plan;try{const outcome=OfflineTravelAgent.agent({text,prefs,db:{A,R,byId},previous});taskContext=outcome.criteria;taskTrace=outcome.trace;clarification='';status='';if(outcome.status==='clarify'){clarification=outcome.question;plan=null;q='';$('#q').value='';update();requestAnimationFrame(()=>$('#clarification')?.scrollIntoView({block:'start'}));return;}if(outcome.status==='no-match'){plan=null;status=outcome.question;update();return}plan=outcome.plan;update(true);}catch(e){console.error(e);plan=last;status='行程暂时无法生成，请重新尝试。';update()}finally{running=false;showWorking(false)}}
function build(){if(running)return;q=$('#q').value.trim();if(!q&&prefs.city==='全省'&&!prefs.days&&!taskContext){status='请先告诉吉小知旅行想法，或选择目的地。';update();return;}runAgent(q,(clarification||adjusting)?taskContext:null);adjusting=false;}
function update(scroll=false){if(tab!=='home'){go('home')}else $('#out').innerHTML=result();if(scroll)requestAnimationFrame(()=>$('#result')?.scrollIntoView({block:'start',behavior:'smooth'}))}function go(t){if(running)return;tab=t;render();window.scrollTo(0,0)}function route(id){if(running)return;cloudError='';const r=R.find(x=>x.id===id);if(!r)return;taskContext=null;taskTrace=[];clarification='';plan={title:r.name,source:'知识库精选线路',reason:r.sub+' · 直接展示仓库预设顺序，未调用模型。',nodes:r.plan};status='';update(true)}
function explore(){return `<div class="page"><span class="kicker">EXPLORE JILIN</span><h1>发现吉林</h1><p>12 条来自工程知识库的候选线路。</p>${routeCards(R)}</div>`}function portals(){return `<div class="page"><span class="kicker">LOCAL COLLABORATION</span><h1>文旅协作</h1><p>此页是三端本机交互体验，不会向真实政府或商户提交任何信息。</p><div class="inline">${['游客','商户','管理'].map(r=>`<button class="secondary" data-role="${r}" ${r===role?'style="background:#176e64;color:white"':''}>${r}端</button>`).join('')}</div><div class="info-card" style="margin-top:14px"><h2>${role==='游客'?'游客反馈':role==='商户'?'游客意见处理':'本机问题与答复'}</h2>${role==='游客'?'<form id="feedback"><label class="label" for="fb">问题描述（不填写敏感信息）</label><textarea id="fb" maxlength="200" required placeholder="例如：景区停车指引不清楚"></textarea><button class="primary">保存本机反馈</button></form>':'<p class="fine">切换角色可查看本机记录并回复。</p>'}</div>${feedback.map((f,i)=>`<div class="info-card"><span class="kicker">${f.reply?'已回复':'待处理'}</span><h3>${esc(f.text)}</h3>${f.reply?`<p>${esc(f.reply)}</p>`:role!=='游客'?`<textarea id="reply${i}" placeholder="输入答复"></textarea><button class="secondary" data-reply="${i}">保存答复</button>`:''}</div>`).join('')}</div>`}function me(){return `<div class="page"><span class="kicker">MY JOURNEY</span><h1>我的</h1><div class="info-card"><h2>旅行计划</h2><p>${saved?esc(saved.title):'尚未保存旅行计划'}</p>${saved?'<div class="inline"><button class="secondary" data-act="restore">继续查看</button><button class="secondary" data-act="forget">清除保存</button></div>':''}</div><div class="info-card"><h2>阅读设置</h2><button class="secondary" data-act="large">切换大字模式</button></div><div class="info-card"><h2>关于体验版</h2><p style="line-height:1.7;color:#536e62">文旅 Agent v0.9.1：通过云端 GLM 工具调用服务规划行程，或使用明确标注的本地规则模式。服务访问码仅在当前会话使用。云端连接失败时不会假装已调用模型。三端协作仅限本机。</p></div></div>`}function render(){$('#screen').innerHTML=({home,explore,portal:portals,me})[tab]();document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}function saveFeedback(){try{localStorage.setItem('wenlv-preview-feedback',JSON.stringify(feedback))}catch{}}function msg(t){status=t;if($('#notice'))$('#notice').textContent=t;else alert(t)}
document.addEventListener('input',e=>{if(e.target.id==='q')q=e.target.value;if(e.target.id==='accessCode')accessCode=e.target.value});document.addEventListener('change',e=>{if(e.target.id==='city')prefs.city=e.target.value});document.addEventListener('submit',e=>{if(e.target.id==='planner'){e.preventDefault();build()}if(e.target.id==='revision'){e.preventDefault();const rev=$('#rev').value.trim();if(rev)runAgent(rev,taskContext)}if(e.target.id==='feedback'){e.preventDefault();const t=$('#fb').value.trim();if(t){feedback.unshift({text:t,reply:''});saveFeedback();render()}}});document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||running)return;if(b.dataset.mode){if(b.dataset.mode==='cloud'&&location.origin!==CLOUD_ORIGIN)return;mode=b.dataset.mode==='cloud'?'cloud':'local';cloudError='';if(mode==='local')accessCode='';render();return}if(b.dataset.example){q=b.dataset.example;taskContext=null;clarification='';$('#q').value=q;build();return}if(b.dataset.tab){go(b.dataset.tab);return}if(b.dataset.pref){const k=b.dataset.pref;prefs[k]=k==='days'?Number(b.dataset.val):b.dataset.val;b.parentNode.querySelectorAll('button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});return}if(b.dataset.route){route(b.dataset.route);return}if(b.dataset.role){role=b.dataset.role;render();return}if(b.dataset.reply!==undefined){const i=Number(b.dataset.reply),v=$('#reply'+i).value.trim();if(v){feedback[i].reply=role+'端答复：'+v;saveFeedback();render()}return}switch(b.dataset.act){case 'save':if(plan){saved={title:plan.title,nodes:plan.nodes,slots:plan.slots,source:'本机保存的行程',reason:'仅保存景点与分日安排。'};try{localStorage.setItem(key,JSON.stringify(saved));msg('已保存到本机。')}catch{msg('此浏览器禁止本地存储，本次会话可继续查看。')}}break;case 'restore':if(saved){plan=saved;taskContext=null;clarification='';status='';update(true)}break;case 'answer':$('#q')?.focus();$('#q')?.scrollIntoView({block:'center'});break;case 'reset':cloudError='';taskContext=null;taskTrace=[];clarification='';status='';plan=null;q='';prefs={city:'全省',days:0,who:'不限',season:'不限'};render();$('#q')?.focus();break;case 'forget':saved=null;try{localStorage.removeItem(key)}catch{}render();break;case 'adjust':adjusting=!!taskContext;status='';q='';$('#q').value='';$('#q')?.focus();$('#q')?.scrollIntoView({block:'center'});break;case 'large':document.body.classList.toggle('big');break;case 'voice':{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('当前浏览器不支持语音输入，请键盘输入。');break}try{const r=new SR();r.lang='zh-CN';r.onresult=e=>{$('#q').value=e.results[0][0].transcript;q=$('#q').value};r.onerror=()=>alert('语音输入不可用，请键盘输入。');r.start()}catch{alert('无法启动语音输入。')}break}case 'speak':if(!plan)break;if(!window.speechSynthesis){msg('当前浏览器不支持朗读');break}if(speechSynthesis.speaking){speechSynthesis.cancel();msg('已停止朗读');break}const u=new SpeechSynthesisUtterance(plan.nodes.map((d,i)=>'第'+(i+1)+'天，'+d.map(id=>byId[id].name).join('，')).join('。'));u.lang='zh-CN';speechSynthesis.speak(u);msg('正在朗读，再次点击停止');break;case 'share':if(!plan)break;const text=plan.title+'\n'+plan.nodes.map((d,i)=>'第'+(i+1)+'天：'+d.map(id=>byId[id].name).join('、')).join('\n')+'\n开放、预约与交通请提前核实。';try{if(navigator.share){await navigator.share({title:'吉林旅行',text});break}if(navigator.clipboard){await navigator.clipboard.writeText(text);msg('已复制行程');break}}catch(err){if(err.name==='AbortError')break}prompt('长按复制行程',text);break}});render();
