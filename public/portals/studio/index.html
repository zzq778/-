<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文旅素材制作</title><link rel="stylesheet" href="../online/online.css"><link rel="stylesheet" href="./studio.css"></head><body><main id="studio" class="online-portal"><header><h1>文旅素材制作</h1><p class="op-note">创作宣传插画、活动主视觉与海报底图。生成图像不代表真实景区摄影。</p></header><p id="studioStatus" role="status">正在连接服务…</p><form id="studioForm"><label for="studioPrompt">素材描述</label><textarea id="studioPrompt" maxlength="1400" required placeholder="例如：吉林冬日民宿活动宣传插画，雾凇、原木建筑、暖色灯光"></textarea><label for="studioCode">素材服务凭证</label><input id="studioCode" type="password" maxlength="160" autocomplete="off" required><label class="studio-consent"><input id="studioConsent" type="checkbox" required>我已核对描述，同意本次调用图像生成服务。</label><button type="submit" id="studioGenerate" disabled>生成图片</button></form><section id="studioResult" hidden><h2>生成结果</h2><img id="studioImage" alt="AI 生成的文旅宣传创意素材"><p class="op-note">AI 生成素材 · 发布前请人工核对内容与版权。</p><button type="button" id="studioSave">保存图片</button></section></main><script src="./studio.js"></script></body></html>
